# mac-build.yml - build the patched Firefox for macOS arm64 on a free GitHub runner
# and publish it as a release asset of this fork.
#
# Restores the macos-arm64 leg that upstream removed from release.yml on 2026-08-26
# (commit eed9abeffe9b). Build/package steps are taken from the last release.yml
# that still had it (81a37ab1180a), with the CI fixes upstream made afterwards
# (sccache stripped from .mozconfig, step-level build timeout).
#
# Trigger: push to a `mac/**` branch, or run manually.
name: mac-build

on:
  push:
    branches: ['mac/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'release tag to publish under'
        default: 'firefox-44-mac'

permissions:
  contents: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSET: firefox-151.0-stealth-macos-arm64.tar.gz
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'firefox-44-mac' }}

jobs:
  build:
    name: build-macos-arm64
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - name: Checkout patched Firefox source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }

      - name: Disk and CPU
        run: |
          df -h / | tail -1
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize

      # FF151 needs macOS SDK >= 26.4. Prefer 26.4.x (what upstream built with);
      # otherwise take the lowest installed Xcode whose SDK satisfies the floor.
      - name: Select Xcode + export SDK path
        run: |
          ls -d /Applications/Xcode*.app
          PICK=""
          for x in $(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V) \
                   $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V); do
            v="$(basename "$x" .app)"; v="${v#Xcode_}"
            if [ "$(printf '%s\n26.4\n' "$v" | sort -V | head -1)" = "26.4" ]; then PICK="$x"; break; fi
          done
          [ -n "$PICK" ] || { echo "ERROR: no Xcode with SDK >= 26.4 on this runner"; exit 1; }
          sudo xcode-select -s "$PICK"
          SDKP="$(xcrun --show-sdk-path)"
          echo "SDK_PATH=$SDKP" >> "$GITHUB_ENV"
          echo "Xcode $PICK, macOS SDK $(xcrun --sdk macosx --show-sdk-version) at $SDKP"

      - name: Add Rust target
        run: rustup target add aarch64-apple-darwin || true

      - name: Extend the repo .mozconfig
        run: |
          test -f .mozconfig || { echo "ERROR: no .mozconfig in source"; exit 1; }
          rm -f mozconfig
          # sccache is not installed on the runner and its cache would start empty
          # anyway; drop the active lines (upstream release.yml does the same with GNU sed).
          perl -i -ne 'print unless /^[^#]*sccache/i' .mozconfig
          {
            echo ""
            echo "# --- release CI levers for macos-arm64 ---"
            echo "ac_add_options --disable-debug-symbols"
            echo "ac_add_options --target=aarch64-apple-darwin"
            echo "ac_add_options --with-macos-sdk=$SDK_PATH"
            echo "mk_add_options MOZ_PARALLEL_BUILD=$(sysctl -n hw.ncpu)"
            echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-rel"
          } >> .mozconfig
          echo "----- final .mozconfig (active lines) -----"; grep -v '^\s*#' .mozconfig | grep -v '^\s*$'

      - name: Build
        timeout-minutes: 240
        run: ./mach build

      - name: Package + validate (macOS)
        run: |
          set -e
          ./mach package
          APP="$(find obj-rel/dist -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "ERROR: no .app produced"; exit 1; }
          echo "built app: $APP"
          python3 -c "import zipfile,sys,glob; jas=glob.glob('$APP/Contents/Resources/omni.ja')+glob.glob('$APP/Contents/Resources/browser/omni.ja'); sys.exit(0 if jas and any(any('juggler' in n.lower() for n in zipfile.ZipFile(j).namelist()) for j in jas) else 1)" \
            || { echo "ERROR: juggler missing from .app omni.ja - Playwright can't drive it"; exit 1; }
          echo "juggler GATE OK"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/firefox" --version
          for need in "Contents/MacOS/firefox" "Contents/Info.plist"; do
            [ -e "$APP/$need" ] || { echo "ERROR: missing $need"; exit 1; }
          done
          plutil -lint "$APP/Contents/Info.plist"
          for key in CFBundleExecutable CFBundleIdentifier CFBundleShortVersionString; do
            plutil -extract "$key" raw -o - "$APP/Contents/Info.plist" >/dev/null \
              || { echo "ERROR: Info.plist missing $key"; exit 1; }
          done
          BAD="$(find "$APP" -type l -print0 | xargs -0 -I{} sh -c 't=$(readlink "{}"); case "$t" in /*) echo "{} -> $t";; esac')"
          [ -z "$BAD" ] || { echo "ERROR: absolute symlinks in .app:"; echo "$BAD" | head -5; exit 1; }
          STABLE="$(dirname "$APP")/Firefox.app"
          [ "$APP" = "$STABLE" ] || mv "$APP" "$STABLE"
          mkdir -p out
          tar -czf "out/$ASSET" -C "$(dirname "$STABLE")" Firefox.app
          ( cd out && shasum -a 256 "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256" )
          git rev-parse HEAD > out/source-commit.txt
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-macos-arm64
          path: out/
          if-no-files-found: error
          retention-days: 14

      # Upstream's own drive + font gates, run on the artifact. Informational here:
      # the real acceptance test is the wrapper on the target Mac.
      - name: Gates (drive + font)
        continue-on-error: true
        run: |
          set -e
          git clone --depth 1 https://github.com/feder-cr/invisible_playwright _wrapper
          python -m pip install --quiet "playwright==$(cat _wrapper/scripts/playwright_pin.txt)"
          mkdir -p ff && tar xzf "out/$ASSET" -C ff
          FF_EXE="ff/Firefox.app/Contents/MacOS/firefox"
          python _wrapper/scripts/ci_drive_gate.py "$FF_EXE" --click
          python _wrapper/scripts/ci_font_gate.py "$FF_EXE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="macOS arm64 build of the patched Firefox, source commit $(cat out/source-commit.txt)."
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" out/* -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG (macOS arm64)" --notes "$NOTES"
          fi
